            question: "Какое правило распределения калорийности в течение дня диетологи считают оптимальным для подростка?",
            options: [
              "Завтрак 25%, Обед 35%, Полдник 15%, Ужин 25%",
              "Отказ от еды днем и 80% калорий перед сном",
              "Равномерные порции сладкого каждые 40 минут",
              "Один плотный прием пищи раз в сутки (100%)"
            ],
            correct: 0,
            rationale: "Дробное 4-разовое питание обеспечивает стабильный уровень глюкозы и аминокислот без перегрузки ЖКТ и отложения излишков в жировые депо на ночь."
          }
        ]
      }
    ];

    /* =====================================================================
       GAME STATE & UI LOGIC
       ===================================================================== */
    let currentScore = 0;
    let answeredQuestions = new Set();
    let activeQuestion = null;

    const boardEl = document.getElementById('jeopardyBoard');
    const scoreEl = document.getElementById('playerScore');
    const modalEl = document.getElementById('questionModal');
    const modalCatEl = document.getElementById('modalCategory');
    const modalPtsEl = document.getElementById('modalPoints');
    const modalQTextEl = document.getElementById('modalQuestionText');
    const optionsContainerEl = document.getElementById('optionsContainer');
    const feedbackBoxEl = document.getElementById('feedbackBox');
    const feedbackTitleEl = document.getElementById('feedbackTitle');
    const feedbackDescEl = document.getElementById('feedbackDesc');
    const btnCloseModalEl = document.getElementById('btnCloseModal');

    function initBoard() {
      boardEl.innerHTML = '';

      // 1. Render Category Headers
      GAME_DATA.forEach(cat => {
        const catHeader = document.createElement('div');
        catHeader.className = 'bg-slate-800/90 text-cyan-300 font-bold text-center text-xs sm:text-sm p-2 sm:p-3 rounded-xl border border-slate-700 flex items-center justify-center min-h-[58px] leading-snug shadow';
        catHeader.textContent = cat.category;
        boardEl.appendChild(catHeader);
      });

      // 2. Render Rows for points: 100, 200, 300, 400, 500
      for (let rowIndex = 0; rowIndex < 5; rowIndex++) {
        for (let colIndex = 0; colIndex < 5; colIndex++) {
          const q = GAME_DATA[colIndex].questions[rowIndex];
          const qId = `${colIndex}-${rowIndex}`;

          const tileBtn = document.createElement('button');
          tileBtn.id = `tile-${qId}`;
          tileBtn.className = 'jeopardy-tile font-hud text-base sm:text-xl font-black py-3 sm:py-5 rounded-xl border border-blue-500/30 bg-blue-900/40 text-amber-300 flex items-center justify-center cursor-pointer shadow-md hover:bg-blue-800/60 disabled:cursor-not-allowed';
          tileBtn.textContent = q.points;

          if (answeredQuestions.has(qId)) {
            markTileAnswered(tileBtn, qId);
          } else {
            tileBtn.addEventListener('click', () => openQuestion(colIndex, rowIndex, qId));
          }

          boardEl.appendChild(tileBtn);
        }
      }
    }

    function openQuestion(colIndex, rowIndex, qId) {
      const cat = GAME_DATA[colIndex];
      const q = cat.questions[rowIndex];
      activeQuestion = { ...q, id: qId, colIndex, rowIndex };

      modalCatEl.textContent = cat.category;
      modalPtsEl.textContent = `${q.points} очков`;
      modalQTextEl.textContent = q.question;

      // Reset feedback box & buttons
      feedbackBoxEl.classList.add('hidden');
      btnCloseModalEl.classList.add('hidden');
      optionsContainerEl.innerHTML = '';

      // Подготавливаем варианты с фиксацией правильности и перемешиваем
      const shuffledOptions = q.options.map((optText, idx) => ({
        text: optText,
        isCorrect: idx === q.correct
      })).sort(() => Math.random() - 0.5);

      // Create 4 option buttons (shuffled)
      shuffledOptions.forEach((opt, idx) => {
        const optBtn = document.createElement('button');
        optBtn.className = 'w-full text-left p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold transition border border-slate-700 hover:border-cyan-500 flex items-center gap-3';
        optBtn.dataset.isCorrect = opt.isCorrect ? 'true' : 'false';
        optBtn.innerHTML = `<span class="w-6 h-6 rounded-lg bg-slate-900 text-cyan-400 border border-slate-700 flex items-center justify-center font-hud text-xs flex-shrink-0">${['А','Б','В','Г'][idx]}</span> <span>${opt.text}</span>`;

        optBtn.addEventListener('click', () => selectAnswer(opt.isCorrect, optBtn));
        optionsContainerEl.appendChild(optBtn);
      });

      modalEl.classList.remove('hidden');
    }

    function selectAnswer(isRight, clickedBtn) {
      const q = activeQuestion;
      const allBtns = optionsContainerEl.querySelectorAll('button');

      // Disable all option clicks
      allBtns.forEach((btn) => {
        btn.disabled = true;
        const btnIsCorrect = btn.dataset.isCorrect === 'true';

        if (btnIsCorrect) {
          btn.classList.remove('bg-slate-800/80', 'border-slate-700');
          btn.classList.add('bg-emerald-950/80', 'border-emerald-500', 'text-emerald-200');
        } else if (btn === clickedBtn && !isRight) {
          btn.classList.remove('bg-slate-800/80', 'border-slate-700');
          btn.classList.add('bg-rose-950/80', 'border-rose-500', 'text-rose-200');
        }
      });

      // Update Score
      if (isRight) {
        currentScore += q.points;
        feedbackBoxEl.className = 'p-3 rounded-xl border text-xs leading-relaxed bg-emerald-950/50 border-emerald-600 text-emerald-200';
        feedbackTitleEl.textContent = `🎉 Верно! (+${q.points} баллов)`;
      } else {
        currentScore = Math.max(0, currentScore - q.points);
        feedbackBoxEl.className = 'p-3 rounded-xl border text-xs leading-relaxed bg-rose-950/50 border-rose-600 text-rose-200';
        feedbackTitleEl.textContent = `❌ Неверно (-${q.points} баллов)`;
      }

      scoreEl.textContent = currentScore;
      feedbackDescEl.textContent = q.rationale;
      feedbackBoxEl.classList.remove('hidden');
      btnCloseModalEl.classList.remove('hidden');

      // Save state
      answeredQuestions.add(`${q.id}-${isRight ? 'win' : 'lose'}`);
      const boardTile = document.getElementById(`tile-${q.id}`);
      if (boardTile) {
        boardTile.disabled = true;
        if (isRight) {
          boardTile.className = 'jeopardy-tile font-hud text-base sm:text-xl font-bold py-3 sm:py-5 rounded-xl border border-emerald-500 bg-emerald-900/60 text-emerald-300 opacity-80';
          boardTile.textContent = '✓';
        } else {
          boardTile.className = 'jeopardy-tile font-hud text-base sm:text-xl font-bold py-3 sm:py-5 rounded-xl border border-rose-500 bg-rose-900/60 text-rose-300 opacity-80';
          boardTile.textContent = '✗';
        }
      }
    }

    btnCloseModalEl.addEventListener('click', () => {
      modalEl.classList.add('hidden');
    });

    document.getElementById('btnResetAll').addEventListener('click', () => {
      if (confirm('Сбросить весь прогресс и счет игры?')) {
        currentScore = 0;
        scoreEl.textContent = '0';
        answeredQuestions.clear();
        initBoard();
      }
    });

    // Start
    initBoard();
  </script>
</body>
</html>
