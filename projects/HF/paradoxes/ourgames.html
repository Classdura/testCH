<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Своя Игра: Мифы и правда о питании</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --accent-color: #48cae4;
      --gold-color: #ffb703;
      --text-color: #f1faee;
      --used-color: #3a506b;
      --danger-color: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--gold-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 1rem;
      color: var(--accent-color);
    }

    .controls {
      margin-bottom: 20px;
    }

    .btn-reset {
      background-color: transparent;
      color: var(--gold-color);
      border: 2px solid var(--gold-color);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background-color: var(--gold-color);
      color: var(--bg-color);
    }

    /* Grid Layout */
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 960px;
      width: 100%;
    }

    .category-card {
      background-color: #0077b6;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 18px 12px;
      text-align: center;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 70px;
      text-transform: uppercase;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .cell-btn {
      background-color: var(--card-bg);
      color: var(--gold-color);
      border: 2px solid #3a506b;
      font-size: 1.8rem;
      font-weight: 800;
      padding: 24px 0;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .cell-btn:hover:not(.used) {
      background-color: #24345d;
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .cell-btn.used {
      background-color: #0e1626;
      color: #415a77;
      border-color: #1e293b;
      cursor: not-allowed;
      text-decoration: line-through;
      box-shadow: none;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 19, 43, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      max-width: 680px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3a506b;
      padding-bottom: 12px;
    }

    .modal-cat {
      color: var(--accent-color);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .modal-points {
      color: var(--gold-color);
      font-weight: 800;
      font-size: 1.3rem;
    }

    .modal-question {
      font-size: 1.35rem;
      line-height: 1.5;
      font-weight: 500;
    }

    .modal-answer-box {
      display: none;
      background-color: #0b132b;
      border-left: 4px solid var(--gold-color);
      padding: 16px;
      border-radius: 4px;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #90e0ef;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .btn-action {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s ease;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .btn-show {
      background-color: var(--gold-color);
      color: #0b132b;
    }

    .btn-close {
      background-color: #3a506b;
      color: #fff;
    }

    @media (max-width: 768px) {
      .game-board {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .category-card {
        font-size: 0.85rem;
        padding: 8px 4px;
        min-height: 50px;
      }
      .cell-btn {
        font-size: 1.2rem;
        padding: 16px 0;
      }
      .modal-question {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Своя Игра: Еда, Тренды и Мифы</h1>
    <p class="subtitle">Интерактивный квиз по мотивам круглого стола о гигиене питания</p>
  </header>

  <div class="controls">
    <button class="btn-reset" onclick="resetBoard()">Сбросить выбранные вопросы</button>
  </div>

  <div class="game-board" id="board">
    <!-- Генерируется скриптом -->
  </div>

  <!-- Модальное окно вопроса -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-meta">
        <span class="modal-cat" id="mCat">Категория</span>
        <span class="modal-points" id="mPoints">100</span>
      </div>
      <div class="modal-question" id="mQuestion">Текст вопроса...</div>
      <div class="modal-answer-box" id="mAnswerBox">
        <strong>Ответ: </strong><span id="mAnswer">Текст ответа...</span>
      </div>
      <div class="modal-actions">
        <button class="btn-action btn-show" id="btnToggle" onclick="toggleAnswer()">Показать ответ</button>
        <button class="btn-action btn-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    const categories = [
      {
        id: "cat1",
        title: "Тренды на полках",
        questions: [
          { points: 100, q: "Какой растительный аналог молока ближе всего к коровьему по полноценности аминокислотного профиля белка?", a: "Соевое молоко." },
          { points: 200, q: "Какую короткоцепочечную жирную кислоту, питающую клетки слизистой кишечника, называют главным плюсом сливочного масла?", a: "Масляную кислоту (бутират)." },
          { points: 300, q: "Как называется психологический феномен, когда ярлыки «эко», «био» или «без сахара» заставляют человека считать продукт безусловно полезным?", a: "«Ореол здоровья» (Health Halo)." },
          { points: 400, q: "Через какое минимальное время непрерывной интенсивной тренировки изотоники начинают превосходить обычную воду, согласно спортивной медицине?", a: "Более 1 часа (до 60 минут обычной воды полностью достаточно)." },
          { points: 500, q: "Чем физиологически грозит резкий перебор клетчатки («файбермаксинг») без должного объема воды?", a: "Метеоризмом, спазмами (дискинезией кишечника) и снижением всасывания железа, кальция и цинка." }
        ]
      },
      {
        id: "cat2",
        title: "Диеты и Психика",
        questions: [
          { points: 100, q: "Как называется расстройство пищевого поведения, проявляющееся навязчивой одержимостью «чистой» и исключительно «правильной» едой?", a: "Орторексия." },
          { points: 200, q: "Какое единственное заболевание является прямым медицинским показанием для строгого пожизненного отказа от глютена?", a: "Целиакия (глютеновая энтеропатия)." },
          { points: 300, q: "Кто, согласно гигиене питания, имеет право официально назначать человеку лечебную или специализированную диету?", a: "Исключительно лечащий врач (по клиническим показаниям)." },
          { points: 400, q: "Какой ключевой витамин почти не встречается в растительной пище и неизбежно уходит в дефицит при строгом несбалансированном веганстве?", a: "Витамин B12." },
          { points: 500, q: "На сжигание какого источника энергии переключается организм при переходе в кетоз на строгой кетодиете?", a: "На окисление жиров и использование кетоновых тел вместо глюкозы." }
        ]
      },
      {
        id: "cat3",
        title: "Маркетинг и Нормы",
        questions: [
          { points: 100, q: "Какое популярное стимулирующее вещество составляет основу стандартной банки энергетика в дозировке около 90 мг?", a: "Кофеин." },
          { points: 200, q: "Назовите хотя бы один распространенный синоним сахара, который производители используют для надписи «без добавления сахара» на этикетке.", a: "Мальтодекстрин, патока, глюкозно-фруктозный сироп, концентрированный сок или мед." },
          { points: 300, q: "В чем главное юридическое отличие БАД от лекарственных препаратов при регистрации и продаже?", a: "БАД регистрируются как пищевая продукция и не требуют обязательных клинических испытаний эффективности перед выходом на рынок." },
          { points: 400, q: "Какой неприятный побочный эффект со стороны ЖКТ вызывает чрезмерное употребление сахарозаменителей-полиолов (сорбит, мальтит)?", a: "Слабительный (диарейный) эффект и сильное вздутие живота." },
          { points: 500, q: "Какое сильнодействующее запрещенное вещество амфетаминового ряда надзорные органы регулярно выявляют в фальсифицированных БАДах для похудения?", a: "Сибутрамин." }
        ]
      }
    ];

    let currentCell = null;
    const usedQuestions = new Set(JSON.parse(localStorage.getItem('jeopardy_used') || '[]'));

    function initBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      // Заголовки категорий
      categories.forEach(cat => {
        const h = document.createElement('div');
        h.className = 'category-card';
        h.textContent = cat.title;
        board.appendChild(h);
      });

      // Строки по уровням баллов (100, 200, 300, 400, 500)
      for (let i = 0; i < 5; i++) {
        categories.forEach(cat => {
          const item = cat.questions[i];
          const btn = document.createElement('button');
          const cellKey = `${cat.id}-${item.points}`;
          
          btn.className = 'cell-btn';
          btn.textContent = item.points;
          btn.dataset.key = cellKey;

          if (usedQuestions.has(cellKey)) {
            btn.classList.add('used');
          }

          btn.onclick = () => openQuestion(cat.title, item, cellKey, btn);
          board.appendChild(btn);
        });
      }
    }

    function openQuestion(catTitle, item, cellKey, element) {
      if (element.classList.contains('used')) return;

      currentCell = { key: cellKey, element: element };

      document.getElementById('mCat').textContent = catTitle;
      document.getElementById('mPoints').textContent = item.points + ' БАЛЛОВ';
      document.getElementById('mQuestion').textContent = item.q;
      document.getElementById('mAnswer').textContent = item.a;

      // Сброс видимости ответа
      document.getElementById('mAnswerBox').style.display = 'none';
      document.getElementById('btnToggle').textContent = 'Показать ответ';

      document.getElementById('modal').classList.add('active');
    }

    function toggleAnswer() {
      const box = document.getElementById('mAnswerBox');
      const btn = document.getElementById('btnToggle');
      if (box.style.display === 'none' || box.style.display === '') {
        box.style.display = 'block';
        btn.textContent = 'Скрыть ответ';
      } else {
        box.style.display = 'none';
        btn.textContent = 'Показать ответ';
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      if (currentCell) {
        currentCell.element.classList.add('used');
        usedQuestions.add(currentCell.key);
        localStorage.setItem('jeopardy_used', JSON.stringify([...usedQuestions]));
        currentCell = null;
      }
    }

    function resetBoard() {
      if (confirm('Сбросить прогресс и сделать все вопросы снова доступными?')) {
        usedQuestions.clear();
        localStorage.removeItem('jeopardy_used');
        document.querySelectorAll('.cell-btn').forEach(btn => btn.classList.remove('used'));
      }
    }

    // Инициализация при загрузке
    initBoard();
  </script>
</body>
</html>
