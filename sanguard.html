game-head p{color:var(--muted);max-width:760px;margin:0}.back{color:var(--cyan);background:none;border:0;padding:0 0 10px;font-weight:700}.game-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.75fr);gap:18px;margin-top:22px}.surface{padding:clamp(19px,3vw,31px)}.surface h2{margin:0 0 10px;font-size:1.3rem}.surface h3{margin:18px 0 10px}.aside{align-self:start}.aside details{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.aside summary{cursor:pointer;color:var(--cyan);font-weight:700}.aside ul{padding-left:20px;color:var(--muted)}.meta{color:var(--cyan);font-size:.77rem;font-weight:800;text-transform:uppercase;letter-spacing:.11em}.options{display:grid;gap:9px;margin:20px 0}.option{width:100%;text-align:left;background:#19394c;border:1px solid #436376;color:#f0fbfd;border-radius:12px;padding:13px 16px;min-height:48px}.option:hover:not(:disabled),.option.selected{border-color:var(--cyan);background:#24516a}.option.correct{border-color:#91e2b4;background:#1c493d}.option.wrong{border-color:#ff9999;background:#5a313b}.feedback{margin-top:18px;padding:15px 17px;border-radius:13px;background:#183c38;border:1px solid #3d8c74}.feedback.bad{background:#442b36;border-color:#9a5f6b}.feedback strong{display:block;color:var(--mint);margin-bottom:4px}.feedback.bad strong{color:var(--bad)}.feedback p{margin:0;color:#e5f1ef}.stepbar{display:flex;gap:5px;margin:18px 0 24px}.stepbar span{height:5px;flex:1;border-radius:5px;background:#315365}.stepbar .done{background:var(--mint)}.stepbar .current{background:var(--cyan)}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #487383;color:#cbe5eb;padding:4px 9px;border-radius:30px;font-size:.82rem}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.case{background:#193a4d;border:1px solid #386073;padding:15px;border-radius:13px;margin:12px 0}.case p{margin:5px 0}.case strong{color:white}.field{display:grid;gap:7px;margin:14px 0;color:#cde3e9}.field input,.field sel  const target=view==='game'?GAMES[session.id].module:currentModule;

function showHome(){view='home';currentModule=null;session=null;chrome();app.innerHTML=`<section class="hero"><div class="eyebrow">Профориентационный симулятор · МПФ</div><h1>Проверьте решение до того, как риск станет болезнью.</h1><p>Выберите направление, разберите ситуацию и получите объяснение каждого шага. Можно проходить модули в любом порядке.</p><div class="actions"><button class="action" data-action="module" data-id="epi">Начать расследование →</button><button class="action secondary" data-action="career">Мой карьерный профиль</button></div></section><div class="section-head"><h2>Восемь направлений</h2><span class="muted small">${completed()} из ${total} испытаний пройдено</span></div><section class="grid" aria-label="Модули">${MODULES.map((m,i)=>`<article class="card"><div class="icon" aria-hidden="true">${m.icon}</div><div class="meta">Модуль ${String(i+1).padStart(2,'0')} · ${m.games.length} ${m.games.length===1?'игра':'игры'}</div><h3>${m.name}</h3><p>${m.desc}</p><button data-action="module" data-id="${m.id}">Открыть модуль →</button></article>`).join('')}</section><p class="footnote">Учебные случаи вымышлены. «Охват решений» — игровая условная величина, не статистика спасённых людей. Данные прогресса остаются в этом браузере.</p>`;window.scrollTo(0,0)}
function showModule(id){const m=MODULES.find(x=>x.id===id);if(!m)return showHome();view='module';currentModule=id;session=null;chrome();app.innerHTML=`<section class="module-head"><button class="back" data-action="home">← Главное меню</button><div class="eyebrow">Модуль ${MODULES.indexOf(m)+1} / 8</div><h1>${m.icon} ${m.name}</h1><p>${m.desc}</p></section><div class="section-head"><h2>Выберите игру</h2></div><section class="grid">${m.games.map((id,i)=>{let g=GAMES[id],best=saved.best[id]||0;return `<article class="card"><div class="meta">Испытание ${String(i+1).padStart(2,'0')} · до ${g.points} баллов</div><h3>${g.title}</h3><p>${g.sub}</p>${best?`<div class="complete">✓ Лучший результат: ${best}</div>`:''}<button data-action="start" data-id="${id}">${best?'Пройти ещё раз':'Начать'} →</button></article>`}).join('')}</section><p class="footnote">В каждом испытании решение сопровождается объяснением. За повторное прохождение учитывается только улучшение результата.</p>`;window.scrollTo(0,0)}
function start(id){const g=GAMES[id];if(!g)return;session={id,step:0,hits:0,answered:false,answer:null,attempted:false,seq:[],selections:[0,0,0],nutCase:Math.floor(Math.random()*10),distance:1,time:10,shield:0,city:150,soil:'',waterAnswers:[],waterFeedback:null};view='game';currentModule=g.module;renderGame();window.scrollTo(0,0)}
function gameShell(content){const g=GAMES[session.id],m=MODULES.find(x=>x.id===g.module);view='game';chrome();app.innerHTML=`<section class="game-head"><button class="back" data-action="module" data-id="${m.id}">← ${m.name}</button><div class="eyebrow">${m.name} / игра</div><h1>${g.title}</h1><p>${g.sub}</p></section><div class="game-grid"><section class="surface" id="play">${content}</section><aside class="surface aside"><div class="meta">Полевые заметки</div><h2>Что нужно знать</h2><ul>${g.brief.map(t=>`<li>${t}</li>`).join('')}</ul><details><summary>Как считаются баллы</summary><p class="muted small">За точные решения начисляется опыт. Повторная игра повышает ваш рекорд, но не суммирует те же баллы. Условный охват начисляется за результат от 60%.</p></details><p class="footnote">Сценарий составлен по присланным материалам. Это учебная модель, не инструкция для практической экспертизы.</p></aside></div>`}
function stepbar(n,max){return `<div class="stepbar" aria-label="Шаг ${n+1} из ${max}">${Array.from({length:max},(_,i)=>`<span class="${i<n?'done':i===n?'current':''}"></span>`).join('')}</div>`}
function renderGame(){const g=GAMES[session.id];if(g.kind==='quiz')return renderQuiz();if(g.kind==='sort')return renderSort();if(g.kind==='sequence')return renderSequence();if(g.kind==='nutrition')return renderNutrition();if(g.kind==='water')return renderWater();if(g.kind==='city')return renderCity();if(g.kind==='soil')return renderSoil();if(g.kind==='radiation')return renderRadiation()}
function renderQuiz(){let g=GAMES[session.id],s=session,q=g.q[s.step],offset=(s.step*2+1)%3;let order=[0,1,2].map(i=>(i+offset)%3);gameShell(`<div class="meta">Ситуация ${s.step+1} / ${g.q.length}</div>${stepbar(s.step,g.q.length)}<h2>${q[0]}</h2><div class="options">${order.map((ix,i)=>`<button class="option ${s.answered?(ix===q[2]?'correct':s.answer===ix?'wrong':''):''}" data-action="answer" data-id="${ix}" ${s.answered?'disabled':''}><strong>${'ABC'[i]}.</strong> ${q[1][ix]}</button>`).join('')}</div>${s.answered?`<div class="feedback ${s.answer===q[2]?'':'bad'}"><strong>${s.answer===q[2]?'Верно':'Разберём решение'}</strong><p>${q[3]}</p></div><div class="actions"><button class="action" data-action="next">${s.step===g.q.length-1?'Результат':'Следующая ситуация →'}</button></div>`:''}`)}
function answer(ix){let g=GAMES[session.id],s=session;if(s.answered||ix<0||ix>2)return;s.answered=true;s.answer=ix;if(ix===g.q[s.step][2])s.hits++;renderQuiz()}
function next(){let g=GAMES[session.id],s=session;if(!s.answered)return;s.answered=false;s.answer=null;if(++s.step>=g.q.length)finish(s.hits/g.q.length);else renderQuiz()}
function renderSort(){let g=GAMES.waste,s=session,item=g.items[s.step];gameShell(`<div class="meta">Объект ${s.step+1} / ${g.items.length}</div>${stepbar(s.step,g.items.length)}<h2>В какой класс направить?</h2><div class="case"><div class="muted small">На сортировочной линии</div><strong style="font-size:1.35rem">${item[0]}</strong></div><div class="options two">${g.bins.map(b=>`<button class="option ${s.answered?(b===item[1]?'correct':s.answer===b?'wrong':''):''}" data-action="bin" data-id="${b}" ${s.answered?'disabled':''}>Класс ${b}</button>`).join('')}</div>${s.answered?`<div class="feedback ${s.answer===item[1]?'':'bad'}"><strong>${s.answer===item[1]?'Верно':'Правильный класс: '+item[1]}</strong><p>${item[2]}</p></div><div class="actions"><button class="action" data-action="sort-next">${s.step===g.items.length-1?'Результат':'Следующий объект →'}</button></div>`:''}`)}
function bin(b){let s=session,g=GAMES.waste;if(s.answered||!g.bins.includes(b))return;s.answered=true;s.answer=b;if(b===g.items[s.step][1])s.hits++;renderSort()}
function sortNext(){let g=GAMES.waste,s=session;if(!s.answered)return;s.answered=false;s.answer=null;if(++s.step>=g.items.length)finish(s.hits/g.items.length);else renderSort()}
function renderSequence(){let g=GAMES.sterile,s=session,shuffled=[g.steps[3],g.steps[0],g.steps[4],g.steps[1],g.steps[2]];gameShell(`<div class="meta">Этап ${s.seq.length+1} / ${g.steps.length}</div>${stepbar(s.seq.length,g.steps.length)}<h2>Выстройте путь инструмента</h2><p class="muted">Нажимайте этапы в правильном порядке. Если ошиблись, можно выбрать другой.</p><div class="key"><strong>Ваша цепочка:</strong> ${s.seq.length?s.seq.map((x,i)=>`${i+1}. ${x}`).join(' → '):'пока пусто'}</div><div class="options two">${shuffled.map((x,i)=>`<button class="option" data-action="sequence" data-id="${g.steps.indexOf(x)}" ${s.seq.includes(x)?'disabled':''}>${x}</button>`).join('')}</div>${s.answer!==null?`<div class="feedback bad"><strong>Этап пока не подходит</strong><p>Сначала ${g.steps[s.seq.length].toLowerCase()}. Попробуйте снова.</p></div>`:''}`)}
function sequence(ix){let g=GAMES.sterile,s=session;if(s.seq.length>=g.steps.length||!g.steps[ix]||s.seq.includes(g.steps[ix]))return;if(ix===s.seq.length){s.seq.push(g.steps[ix]);if(!s.attempted)s.hits++;s.answer=null;s.attempted=false;if(s.seq.length===g.steps.length)return finish(s.hits/g.steps.length);renderSequence()}else{s.answer=ix;s.attempted=true;renderSequence()}}
const MEALS=[
 [['Каша, яйцо, фрукт',500,true],['Булочка и сладкий напиток',650,false],['Только кофе',80,false]],

const NUT_CASES=[['Школьник 7 лет',2100],['Старшеклассница 16 лет',2200],['Работник с высокой физической нагрузкой',3800],['Женщина 68 лет',1800],['Беременная женщина, II триместр',2450],['Спортсмен 17 лет',3350],['Офисный работник 40 лет',1800],['Ребенок 2 лет',1300],['Работник горячего цеха',3600],['Мужчина 78 лет',1600]];
const menuFor=s=>MEALS.map(list=>list.map(([name,kcal,balanced])=>[name,Math.round(kcal*NUT_CASES[s.nutCase][1]/2000/10)*10,balanced]));
function renderNutrition(){let s=session,goal=NUT_CASES[s.nutCase][1],meals=menuFor(s),cal=s.selections.reduce((n,x,i)=>n+meals[i][x][1],0);gameShell(`<div class="meta">Сценарий ${s.nutCase+1} / 10 · условная цель ${goal} ккал</div><h2>Соберите меню на день</h2><p class="muted">Персонаж: ${NUT_CASES[s.nutCase][0]}. Подберите разнообразный набор, близкий к условной цели. Порции и энергия здесь упрощены; возрастные и медицинские потребности полностью не моделируются.</p>${meals.map((list,i)=>`<label class="field">${['Завтрак','Обед','Ужин'][i]}<select data-action="meal" data-index="${i}">${list.map((x,j)=>`<option value="${j}" ${s.selections[i]===j?'selected':''}>${x[0]} — ≈${x[1]} ккал</option>`).join('')}</select></label>`).join('')}<div class="key">Всего: <span class="readout">${cal.toLocaleString('ru-RU')}</span> ккал · разница ${Math.abs(cal-goal)} ккал</div><div class="actions"><button class="action" data-action="nutrition-check">Оценить рацион</button></div>${s.answered?`<div class="feedback ${s.hits>=2?'':'bad'}"><strong>${s.hits===3?'Хороший учебный баланс':'Есть что улучшить'}</strong><p>${s.hits===3?'Энергия близка к условной цели; в каждом приеме пищи есть полноценные продукты.':'Посмотрите на разнообразие и общую энергию. Для реального человека рацион рассчитывают индивидуально.'}</p><button class="action secondary" style="margin-top:12px" data-action="nutrition-result">К результату</button></div>`:''}`)}
function checkNutrition(){let s=session,goal=NUT_CASES[s.nutCase][1],meals=menuFor(s),cal=s.selections.reduce((n,x,i)=>n+meals[i][x][1],0);s.hits=s.selections.filter((x,i)=>meals[i][x][2]).length;if(Math.abs(cal-goal)>Math.max(150,goal*.075))s.hits=Math.min(s.hits,2);s.answered=true;renderNutrition()}
const WATER=[['Проба А · скважина','E. coli: не обнаружена; документирована обработка',0,'Предварительно благополучная проба; полный вывод требует остальных показателей.'],['Проба Б · школа','E. coli: обнаружена',1,'Обнаружение индикатора требует расследования и повторной оценки.'],['Проба В · улица','E. coli: не обнаружена; после аварии сети вода мутная',1,'Из-за аварии и мутности одной отрицательной пробы недостаточно.']];
function renderWater(){let s=session,w=WATER[s.step];gameShell(`<div class="meta">Проба ${s.step+1} / ${WATER.length}</div>${stepbar(s.step,WATER.length)}<h2>${w[0]}</h2><div class="case">${w[1]}</div><p>Какой предварительный статус выберете?</p><div class="options two"><button class="option ${s.answered?(w[2]===0?'correct':s.answer===0?'wrong':''):''}" data-action="water" data-id="0" ${s.answered?'disabled':''}>Нет явного сигнала; продолжить полный контроль</button><button class="option ${s.answered?(w[2]===1?'correct':s.answer===1?'wrong':''):''}" data-action="water" data-id="1" ${s.answered?'disabled':''}>Изолировать риск и провести расследование</button></div>${s.answered?`<div class="feedback ${s.answer===w[2]?'':'bad'}"><strong>${s.answer===w[2]?'Верно':'Разбор пробы'}</strong><p>${w[3]}</p></div><div class="actions"><button class="action" data-action="water-next">${s.step===WATER.length-1?'Результат':'Следующая проба →'}</button></div>`:''}`)}
function waterAnswer(x){let s=session,w=WATER[s.step];if(s.answered||![0,1].includes(x))return;s.answered=true;s.answer=x;if(x===w[2])s.hits++;renderWater()}
function waterNext(){let s=session;if(!s.answered)return;s.answered=false;s.answer=null;if(++s.step>=WATER.length)finish(s.hits/WATER.length);else renderWater()}
function renderCity(){let s=session;gameShell(`<div class="meta">План застройки · проектная граница 300 м</div><h2>Разместите жилой квартал</h2><p>Для этой учебной площадки проектировщик обозначил границу 300 м от условного предприятия. Выберите ближайшее расположение <em>за границей</em>, затем предложите проверку воздействия.</p><label class="field">Расстояние от предприятия <input type="range" min="100" max="600" step="10" value="${s.city}" data-action="city-range"></label><div class="readout">${s.city} м</div><div class="key">${s.city<300?'Участок внутри заданной границы':'Участок за заданной границей'} · дополнительно проверьте воздух и шум на месте.</div><div class="actions"><button class="action" data-action="city-check">Утвердить площадку</button></div>${s.answered?`<div class="feedback ${s.hits?'':'bad'}"><strong>${s.hits?'Решение принято':'Нужно изменить расположение'}</strong><p>${s.hits?'Квартал расположен за заданной границей. В реальном проекте нужна оценка фактического воздействия и юридических границ.':'Жилой квартал нельзя размещать внутри указанной в условии границы.'}</p><button class="action secondary" style="margin-top:12px" data-action="city-result">К результату</button></div>`:''}`)}
function renderSoil(){let s=session;gameShell(`<div class="meta">Лаборатория почвы · три вещества</div><h2>Вычислите Zc</h2><p>Коэффициенты к фону: <strong>2, 5 и 3</strong>. Для трех веществ из суммы нужно вычесть 2.</p><div class="key">Zc = (2 + 5 + 3) − (3 − 1)</div><label class="field">Ваш результат <input type="number" min="0" max="999" inputmode="numeric" value="${esc(s.soil)}" data-action="soil-input" placeholder="Введите число"></label><div class="actions"><button class="action" data-action="soil-check">Проверить расчет</button></div>${s.answered?`<div class="feedback ${s.hits?'':'bad'}"><strong>${s.hits?'Верно: Zc = 8':'Zc = 8'}</strong><p>Сумма коэффициентов 10; вычитаем 2. Одна цифра не заменяет анализ состава и источников загрязнения.</p><button class="action secondary" style="margin-top:12px" data-action="soil-result">К результату</button></div>`:''}`)}
function renderRadiation(){let s=session,r=(s.time/10)/(s.distance*s.distance)/Math.pow(2,s.shield);gameShell(`<div class="meta">Относительная модель · исходное значение 100%</div><h2>Снизьте условную экспозицию до 12,5%</h2><p>Изменяйте три параметра. При удвоении расстояния в этой модели показатель уменьшается в четыре раза.</p><label class="field">Время: ${s.time} мин <input type="range" min="1" max="10" step="1" value="${s.time}" data-action="radiation-range" data-key="time"></label><label class="field">Расстояние: ${s.distance} м <input type="range" min="1" max="4" step="1" value="${s.distance}" data-action="radiation-range" data-key="distance"></label><label class="field">Слои половинного ослабления: ${s.shield} <input type="range" min="0" max="3" step="1" value="${s.shield}" data-action="radiation-range" data-key="shield"></label><div class="key">Относительное воздействие: <span class="readout">${(r*100).toFixed(1).replace('.',',')}%</span><br><span class="small muted">(время / 10) ÷ расстояние² ÷ 2^слои</span></div><div class="actions"><button class="action" data-action="radiation-check">Проверить защиту</button></div>${s.answered?`<div class="feedback ${s.hits?'':'bad'}"><strong>${s.hits?'Цель достигнута':'Нужна дополнительная защита'}</strong><p>Сочетание времени, расстояния и экрана иллюстрирует физические способы снижения экспозиции. Реальные параметры рассчитывают специалисты.</p><button class="action secondary" style="margin-top:12px" data-action="radiation-result">К результату</button></div>`:''}`)}
function finish(ratio){let s=session,g=GAMES[s.id],earned=Math.round(g.points*Math.max(0,Math.min(1,ratio))),previous=saved.best[s.id]||0;saved.best[s.id]=Math.max(previous,earned);save();view='result';chrome();app.innerHTML=`<button class="back" data-action="module" data-id="${g.module}">← Все игры модуля</button><section class="result"><div class="tag">Испытание завершено</div><h2>${g.title}</h2><p>За это прохождение: <strong>${earned} / ${g.points}</strong> баллов. Лучший результат: <strong>${saved.best[s.id]}</strong>.</p><p>${ratio>=.8?'Вы разобрали ключевые риски. Попробуйте другое направление.':ratio>=.6?'Основа освоена. Можно улучшить результат или перейти к следующей задаче.':'Попробуйте пройти кейс ещё раз: объяснения к каждому выбору подскажут логику.'}</p><div class="actions"><button class="action" data-action="module" data-id="${g.module}">Другие игры →</button><button class="action secondary" data-action="start" data-id="${s.id}">Повторить</button><button class="action secondary" data-action="career">Карьерный профиль</button></div></section><p class="footnote">Игровой охват решений — условная величина. Он не отражает реальные исходы здоровья.</p>`;if(earned>previous)notify(`Новый результат: +${earned-previous} баллов`);window.scrollTo(0,0)}
function career(){view='career';session=null;currentModule=null;chrome();const careers=[['Эпидемиолог',['epi'],'Вы ищете связи между случаями и источниками риска.'],['Гигиенист медицинских организаций',['hospital','waste'],'Вы выстраиваете безопасные маршруты и обращение с медицинскими отходами.'],['Гигиенист питания',['food'],'Вы проверяете безопасность производства и питания.'],['Специалист по коммунальной и радиационной гигиене',['environment','radiation'],'Вы исследуете среду обитания и физические факторы.'],['Гигиенист труда',['work'],'Вы оцениваете рабочие места и профилактические меры.'],['Гигиенист детей и подростков',['school'],'Вы изучаете условия обучения, нагрузки и среду класса.']];let scores=careers.map(c=>{let games=c[1].flatMap(id=>MODULES.find(m=>m.id===id).games);return [c,games.reduce((n,id)=>n+(saved.best[id]||0),0)/games.reduce((n,id)=>n+GAMES[id].points,0)]});let top=scores.sort((a,b)=>b[1]-a[1])[0];let found=top[1]>0?top[0]:null;let visited=MODULES.filter(m=>m.games.some(id=>saved.best[id]>0)).length;
 app.innerHTML=`<button class="back" data-action="home">← Главное меню</button><section class="module-head"><div class="eyebrow">Итоги исследовательской смены</div><h1>Карьерный компас</h1><p>Профиль строится по вашим лучшим результатам в играх. Он показывает интерес к теме, а не профессиональные способности.</p></section><div class="result"><span class="tag">${visited} / 8 направлений попробовано</span><h2>${found?found[0]:'Откройте первое направление'}</h2><p>${found?found[2]:'После первого испытания здесь появится ваш предварительный профиль.'}</p><div class="actions"><button class="action" data-action="${found?'certificate':'module'}" ${found?'':'data-id="epi"'}>${found?'Создать сертификат':'Начать расследование'} →</button></div></div><div class="section-head"><h2>Изученные направления</h2></div><div class="grid">${MODULES.map(m=>`<div class="card" style="min-height:120px"><div class="meta">${m.icon} ${m.name}</div><p style="margin-top:9px">${m.games.filter(id=>saved.best[id]>0).length} из ${m.games.length} испытаний</p></div>`).join('')}</div><p class="footnote">Карьерный профиль приблизителен и обновляется после новых игр.</p>`;window.scrollTo(0,0)}
function certificate(){view='certificate';chrome();app.innerHTML=`<div class="actions"><button class="action secondary" data-action="career">← К профилю</button></div><section class="surface" style="margin-top:20px"><h1>Именной сертификат</h1><p class="muted">Введите имя так, как его нужно показать при печати. Оно не передается на сервер.</p><label class="field">Имя участника <input id="person" type="text" maxlength="60" autocomplete="name" placeholder="Имя и фамилия"></label><button class="action" data-action="make-cert">Создать сертификат</button></section>`;window.scrollTo(0,0)}
function makeCert(){let name=document.getElementById('person')?.value.trim();if(!name)return notify('Введите имя для сертификата');let safe=esc(name),date=new Intl.DateTimeFormat('ru-RU',{dateStyle:'long'}).format(new Date());app.innerHTML=`<div class="actions"><button class="action secondary" data-action="career">← К профилю</button><button class="action" data-action="print">Печать / сохранить PDF</button></div><article class="certificate"><div class="seal">✚</div><div style="letter-spacing:.22em;text-transform:uppercase">SanGuard · МПФ</div><h2>Сертификат участника</h2><div class="name">${safe}</div><p>завершил(а) учебные испытания по гигиене и эпидемиологии</p><p><strong>${completed()} из ${total}</strong> испытаний · индекс знаний <strong>${points()}</strong></p><p>${date}</p><div class="seal" style="font-size:2.3rem">✧</div></article><p class="footnote">Профориентационный сертификат участия, не документ об образовании или допуске к профессиональной деятельности.</p>`;window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'home':showHome();break;case'module':showModule(id);break;case'start':start(id);break;case'career':career();break;case'certificate':certificate();break;case'make-cert':makeCert();break;case'print':window.print();break;case'answer':answer(Number(id));break;case'next':next();break;case'bin':bin(id);break;case'sort-next':sortNext();break;case'sequence':sequence(Number(id));break;case'nutrition-check':checkNutrition();break;case'nutrition-result':finish(session.hits/3);break;case'water':waterAnswer(Number(id));break;case'water-next':waterNext();break;case'city-check':session.hits=session.city>=300?1:0;session.answered=true;renderCity();break;case'city-result':finish(session.hits);break;case'soil-check':session.hits=Number(session.soil)===8&&session.soil!==''?1:0;session.answered=true;renderSoil();break;case'soil-result':finish(session.hits);break;case'radiation-check':session.hits=(session.time/10)/(session.distance**2)/2**session.shield<=.125?1:0;session.answered=true;renderRadiation();break;case'radiation-result':finish(session.hits);break}});
document.addEventListener('input',e=>{let a=e.target.dataset.action;if(!session)return;if(a==='city-range'){session.city=Number(e.target.value);session.answered=false;let r=document.querySelector('.readout');if(r)r.textContent=session.city+' м'}else if(a==='soil-input'){session.soil=e.target.value;session.answered=false}else if(a==='radiation-range'){session[e.target.dataset.key]=Number(e.target.value);session.answered=false;let r=(session.time/10)/(session.distance**2)/2**session.shield;let display=document.querySelector('.readout');if(display)display.textContent=(r*100).toFixed(1).replace('.',',')+'%'}else if(a==='meal'){session.selections[Number(e.target.dataset.index)]=Number(e.target.value);session.answered=false;renderNutrition()}});
document.addEventListener('change',e=>{if(!session)return;if(e.target.dataset.action==='city-range')renderCity();if(e.target.dataset.action==='radiation-range')renderRadiation()});
showHome();
})();
</script></body></html>
